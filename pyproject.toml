[project]
name = "knowledgeops-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "docling>=2.124.0",
    "einops>=0.8.2",
    "fastapi>=0.136.3",
    "gradio>=6.16.0",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "litellm>=1.87.1",
    "openai>=2.40.0",
    "pandas>=3.0.3",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.4",
    "sqlalchemy>=2.0.50",
    "torch==2.12.0",
    "transformers>=5.4",
    "uvicorn>=0.48.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "locust>=2.44.4",
]

