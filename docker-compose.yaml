version: "3.9"

volumes:
  qdrant_data:

services:

  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - knowledge-network


  vllm:
    image: vllm/vllm-openai:nightly-93d8f834dd8acf33eb0e2a75b2711b628cb6e226
    container_name: vllm
    restart: unless-stopped

    ports:
      - "8000:8000"

    gpus: all

    volumes:
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface

    environment:
      HF_HUB_OFFLINE: "0"

    command: >
      --model mistralai/Ministral-3-8B-Instruct-2512
      --tokenizer_mode mistral 
      --config_format mistral 
      --load_format mistral
      --host 0.0.0.0
      --port 8000
      --api-key ${OPENAI_API_KEY}
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --max-num-seqs 64

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 5s
      retries: 30
      start_period: 60s

    networks:
      - knowledge-network


  fastapi:
    image: knowledgeops:v.1.0
    container_name: knowledgeops-api
    restart: unless-stopped

    depends_on:
      vllm:
        condition: service_healthy

    ports:
      - "8080:8000"

    env_file:
      - .env.docker

    volumes:
      - ./data:/app/data

    networks:
      - knowledge-network


networks:
  knowledge-network:
    driver: bridge